# Comments on a PR that changes the pinned Gotify release (package.json "gotify.tag") with
# the upstream diff of the directories this server was ported from, and labels it
# `safe-update` or `needs-port`. It never merges or approves anything.
#
# Verdict (Go test files are ignored): a diff in router/, api/, auth/, model/, database/ or config/ (the Go server code
# that src/ mirrors), a missing path, or tags that cannot be compared means `needs-port`.
# A diff only in ui/ is `safe-update`: the web UI is rebuilt from the new tag on deploy and
# nothing in src/ mirrors it (src/version.ts and package.json still need the new version, commit and date). Its file list is shown for information.
#
# Why pull_request_target: on `pull_request`, PRs from bots and forks get a read-only token and
# could not comment or label. This is safe here because the job never checks out or
# runs PR code. It only reads package.json from base and head through the API and
# parses it with jq. The two versions are checked against a strict regex before use,
# values reach the shell through env vars (never interpolated), and the token is
# limited to the permissions below. Like any pull_request_target workflow, it runs
# the copy on the default branch.
name: Upstream check
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: [package.json]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: upstream-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    if: github.repository == 'Renji61/Gotify-Cloudflare'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Compare upstream
        run: |
          ver() { gh api -H "Accept: application/vnd.github.raw" "repos/$1/contents/package.json?ref=$2" \
            | jq -r '.gotify.tag // empty'; }
          OLD=$(ver "$BASE_REPO" "$BASE_SHA"); NEW=$(ver "$HEAD_REPO" "$HEAD_SHA")
          [ "$OLD" = "$NEW" ] && { echo "gotify.tag unchanged"; exit 0; }
          RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          PATHS="router api auth model database config"
          NOTE=""; STAT=""; DIFF=""; UI=""; VALID=1
          if [[ ! $OLD =~ $RE || ! $NEW =~ $RE ]]; then
            VALID=0; OLD=invalid; NEW=invalid
            NOTE="Could not compare: gotify.tag must be an exact release tag such as \`v3.1.1\`."
          else
            git init -q up && cd up && git remote add origin https://github.com/gotify/server
            if ! git fetch -q --depth=1 --filter=blob:none origin tag "$OLD" tag "$NEW"; then
              NOTE="Could not compare: tag \`$OLD\` or \`$NEW\` is missing upstream."
            else
              for p in $PATHS ui; do
                [ -n "$(git ls-tree -r "$NEW" -- "$p")" ] || NOTE="$NOTE"$'\n'"- \`$p/\` no longer exists at $NEW (renamed or removed): needs a manual port."
              done
              # shellcheck disable=SC2086  # $PATHS is deliberately split into arguments
              STAT=$(git diff --stat "$OLD" "$NEW" -- $PATHS ':!*_test.go')
              # shellcheck disable=SC2086
              DIFF=$(git diff "$OLD" "$NEW" -- $PATHS ':!*_test.go' | head -n 300 | head -c 40000)
              UI=$(git diff --stat "$OLD" "$NEW" -- ui | tail -n 30)
            fi
          fi
          if [ -z "$NOTE$STAT" ]; then ADD=safe-update; DEL=needs-port
            if [ -n "$UI" ]; then VERDICT="Only the web UI changed upstream: no server port needed. Still update \`src/version.ts\` (version, commit, date) and the \`version\` field in \`package.json\` in this PR; the UI build refuses a tag whose commit differs from \`src/version.ts\`."
            else VERDICT="No relevant upstream changes: safe update. Still update \`src/version.ts\` (version, commit, date) and the \`version\` field in \`package.json\` in this PR; the UI build refuses a tag whose commit differs from \`src/version.ts\`."; fi
          else ADD=needs-port; DEL=safe-update; VERDICT="Needs a port: review the changes below, update \`src/\` and \`src/version.ts\`, and add tests."; fi
          {
            echo "<!-- upstream-check -->"
            echo "### Upstream check: \`$OLD\` -> \`$NEW\`"
            echo; echo "**$VERDICT**"
            [ -n "$NOTE" ] && { echo; echo "$NOTE"; }
            [ -n "$STAT" ] && { echo; echo '```'; echo "$STAT"; echo '```'; }
            [ -n "$DIFF" ] && { echo; echo "<details><summary>Diff (first 300 lines)</summary>"; echo; echo '```diff'; echo "$DIFF"; echo '```'; echo "</details>"; }
            [ -n "$UI" ] && { echo; echo "<details><summary>Web UI files changed (last 30 lines)</summary>"; echo; echo '```'; echo "$UI"; echo '```'; echo "</details>"; }
            if [ "$VALID" = 1 ]; then echo; echo "[Full upstream compare](https://github.com/gotify/server/compare/$OLD...$NEW)"; fi
          } > "$RUNNER_TEMP/body.md"
          gh label create safe-update --force --color 0e8a16 --description "Upstream release needs no server changes"
          gh label create needs-port --force --color d93f0b --description "Upstream release changed ported files"
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$ADD" > /dev/null
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/$DEL" > /dev/null 2>&1 || true
          ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- upstream-check -->"))) | .id' | head -n 1)
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/body.md" > /dev/null; fi
